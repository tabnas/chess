"638" y="224" width="44" height="26" rx="4" ry="4"/><text class="rr-label" x="660" y="237">rav</text></a><path class="rr-line" d="M660 250V268"/><path class="rr-line" d="M485 286V304"/><path class="rr-line" d="M485 295H692"/><path class="rr-line" d="M485 179H692"/><path class="rr-line" d="M692 179V295"/><path class="rr-line" d="M485 304V318"/><circle class="rr-cap" cx="485" cy="318" r="3"/></g><g id="rav"><text class="rr-title" x="288" y="367">rav</text><circle class="rr-cap" cx="330" cy="378" r="3"/><path class="rr-line" d="M330 378V392"/><rect class="rr-term" x="315" y="392" width="30" height="26" rx="13" ry="13"/><text class="rr-label" x="330" y="405">(</text><path class="rr-line" d="M330 418V436"/><a href="#movetext"><rect class="rr-nonterm" x="288" y="436" width="84" height="26" rx="4" ry="4"/><text class="rr-label" x="330" y="449">movetext</text></a><path class="rr-line" d="M330 462V480"/><rect class="rr-term" x="315" y="480" width="30" height="26" rx="13" ry="13"/><text class="rr-label" x="330" y="493">)</text><path class="rr-line" d="M330 506V520"/><circle class="rr-cap" cx="330" cy="520" r="3"/></g><g id="move"><text class="rr-title" x="288" y="569">move</text><circle class="rr-cap" cx="310" cy="580" r="3"/><path class="rr-line" d="M310 580V594"/><rect class="rr-term" x="288" y="594" width="44" height="26" rx="13" ry="13"/><text class="rr-label" x="310" y="607">SAN</text><path class="rr-line" d="M310 620V634"/><circle class="rr-cap" cx="310" cy="634" r="3"/></g><text class="rr-title" x="16" y="885">Tokens</text><text class="rr-legend" x="16" y="907"><tspan class="rr-legend-tok">CMT</tspan>  —  CMT token</text><text class="rr-legend" x="16" y="925"><tspan class="rr-legend-tok">MVN</tspan>  —  text matching /\d+(?![-/])(?:[ \t]*\.+)?/</text><text class="rr-legend" x="16" y="943"><tspan class="rr-legend-tok">NAG</tspan>  —  text matching /\$\d+/</text><text class="rr-legend" x="16" y="961"><tspan class="rr-legend-tok">RES</tspan>  —  text matching /(?:1-0|0-1|1\/2-1\/2|\*)(?![A-Za-z0-9_+#=:/-])/</text><text class="rr-legend" x="16" y="979"><tspan class="rr-legend-tok">RMK</tspan>  —  RMK token</text><text class="rr-legend" x="16" y="997"><tspan class="rr-legend-tok">SAN</tspan>  —  text matching /(?:(?&lt;castle&gt;O-O-O|O-O|0-0-0|0-0)|(?&lt;piece&gt;[KQRBNP])(?&lt;dfile&gt;[a-h])?(?&lt;drank&gt;[1-8])?(?&lt;pcapture&gt;x)?(?&lt;pto&gt;[a-h][1-8])|(?&lt;pfile&gt;[a-h])(?:x(?&lt;pxfile&gt;[a-h]))?(?&lt;prank&gt;[1-8])(?:=?(?&lt;promotion&gt;[QRBN]))?)(?&lt;check&gt;\+\+|[+#])?(?&lt;annotation&gt;!!|\?\?|!\?|\?!|!|\?)?(?![A-Za-z0-9_+#=:-])/</text><text class="rr-legend" x="16" y="1015"><tspan class="rr-legend-tok">ST</tspan>  —  quoted string (e.g. &quot;text&quot;)</text><text class="rr-legend" x="16" y="1033"><tspan class="rr-legend-tok">TGN</tspan>  —  text matching /[A-Za-z0-9_]+/</text><text class="rr-title" x="16" y="1089">Ignored tokens</text><text class="rr-legend" x="16" y="1111"><tspan class="rr-legend-tok">CM</tspan>  —  comment</text><text class="rr-legend" x="16" y="1129"><tspan class="rr-legend-tok">LN</tspan>  —  newline (line break)</text><text class="rr-legend" x="16" y="1147"><tspan class="rr-legend-tok">SP</tspan>  —  whitespace (spaces or tabs)</text></g></svg>