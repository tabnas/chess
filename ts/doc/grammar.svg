<svg xmlns="http://www.w3.org/2000/svg" class="railroad" width="2275" height="1170" viewBox="0 0 2275 1170"><style>svg.railroad{background:#fff;font-family:monospace;font-size:13px}.rr-line{stroke:#334;stroke-width:2;fill:none}.rr-cap{fill:#334}.rr-term{fill:#e8f0ff;stroke:#334;stroke-width:2}.rr-nonterm{fill:#fff7e8;stroke:#334;stroke-width:2}.rr-label{fill:#111;text-anchor:middle;dominant-baseline:middle}.rr-comment{fill:#666;font-style:italic;text-anchor:middle;dominant-baseline:middle}.rr-title{fill:#113;font-weight:bold;font-size:15px}.rr-legend{fill:#333;font-size:12px}.rr-legend-tok{fill:#113;font-weight:bold}a:hover .rr-nonterm{fill:#ffe6b3;cursor:pointer}</style><g><g id="pgn"><text class="rr-title" x="16" y="31">pgn</text><circle class="rr-cap" cx="58" cy="42" r="3"/><path class="rr-line" d="M58 42V56"/><a href="#gameitem"><rect class="rr-nonterm" x="16" y="56" width="84" height="26" rx="4" ry="4"/><text class="rr-label" x="58" y="69">gameitem</text></a><path class="rr-line" d="M58 82V96"/><circle class="rr-cap" cx="58" cy="96" r="3"/></g><g id="gameitem"><text class="rr-title" x="16" y="145">gameitem</text><circle class="rr-cap" cx="42" cy="156" r="3"/><path class="rr-line" d="M42 156V170"/><path class="rr-line" d="M42 170V188"/><a href="#game"><rect class="rr-nonterm" x="16" y="188" width="52" height="26" rx="4" ry="4"/><text class="rr-label" x="42" y="201">game</text></a><path class="rr-line" d="M42 214V232"/><path class="rr-line" d="M42 223H78"/><path class="rr-line" d="M42 179H78"/><path class="rr-line" d="M78 179V223"/><path class="rr-line" d="M42 232V246"/><circle class="rr-cap" cx="42" cy="246" r="3"/></g><g id="game"><text class="rr-title" x="16" y="295">game</text><circle class="rr-cap" cx="128" cy="306" r="3"/><path class="rr-line" d="M128 306V320"/><path class="rr-line" d="M128 320V338"/><path class="rr-line" d="M38 338H218"/><path class="rr-line" d="M38 400H218"/><path class="rr-line" d="M128 400V418"/><path class="rr-line" d="M38 338V356"/><a