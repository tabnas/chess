# Target: tabnas/chess -> .github/workflows/pages.yml
#
# Staged so the action pins here can be promoted by rollout/apply-workflows.sh
# (ADR-8: automation sessions cannot push .github/workflows/*). This was the
# only live workflow in the fleet carrying unpinned action tags with no
# template to fix it through — skills/ci.yml and support/ci.yml, the other
# two, already had one.
#
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one midway: a half-published
# site is worse than a stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: 24

      # web/ bundles the library, so ts/ is built first — the same order
      # publish-web uses.
      - name: Build the library the component bundles
        working-directory: ts
        run: npm i && npm run build
      - name: Build the site
        working-directory: web
        run: npm i && npm run build

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0
        
