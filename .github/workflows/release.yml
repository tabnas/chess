# Target: tabnas/chess -> .github/workflows/release.yml
#
# Publishes @tabnas/chess to npm via GitHub OIDC Trusted Publishing (no
# token), writes the release tags, and separately ships the bundled web
# component. The fleet-standard shape — see lsp__release.yml for the
# reasoning — plus the second job this repo has always had.
#
# STAGED AS PART OF THE M9 SWEEP: release.yml was the one workflow kind
# never brought under rollout/, so ADR-16's node24 sweep never reached
# it and every deployed copy still pinned checkout@34e11487 and
# setup-node@49933ea5. Both jobs' pins move here.
#
# TWO PACKAGES, TWO TAG LINES, and that is deliberate:
#
#   ts/  -> @tabnas/chess       ts/v*   library, in admin/publish.sh ORDER
#   web/ -> @tabnas/chess-game  web/v*  bundled <chess-game> component
#
# The component carries its own version line because it is a BUILT
# artifact whose contents change when the BUNDLE changes — a new parser,
# a board fix — which is not the same event as a grammar release.
# publish.sh covers ts/ and go/ only; publish-web is how the component
# ships.
#
# The dispatch path releases the LIBRARY (ts/ + go/ tags). The component
# keeps its tag-push path: its version is not the library's, so a single
# dispatch input cannot mean both, and inventing one would let a library
# release quietly republish a component that had not changed.
#
# npm allows exactly ONE workflow file per trusted publisher — and this
# repo has TWO packages, so both trust records must name THIS file.
# Renaming it breaks both until the npm-side entries are updated.
#
# THE GITHUB RELEASE AND THE C LIBRARIES (ADR-19). Once go/v<version>
# is on the remote, the clib job calls clib-release.yml, which creates
# the GitHub Release on that tag as a draft, builds and attaches the
# shared libraries and manifest.json, and only then publishes it. So a
# dispatch ships all three: npm, the Go module and the C artifacts. It is
# a reusable-workflow call because a Release created with GITHUB_TOKEN
# starts no workflow run, so an on-release trigger would never fire. A
# failed C build unpublishes nothing: it leaves a draft Release for a
# clib-release.yml dispatch (darwin_only: false) to finish.
#
# CRATES.IO (ADR-21, deployed and inert). Where the repository has a
# Rust crate, the crates job hands the same release tag to
# crates-release.yml, which publishes rs/ to crates.io from that tag over
# OIDC trusted publishing. Both files are live, and both jobs are inert
# until a maintainer sets the TABNAS_CRATES variable to 'on',
# which happens once the crate exists and its trusted publisher names
# THIS file. crates.io matches the top-level workflow (the OIDC
# workflow_ref), not the called one, so renaming release.yml breaks
# crates.io as it breaks npm. No job needs the crates job, so a failed
# crates publish blocks nothing and unpublishes nothing. Re-run that job
# to repair it.
#
# Actions are pinned to full commit SHAs with the corresponding release
# as a trailing comment, at the action's latest release
# (ADR-16).

name: release

on:
  workflow_dispatch:
    inputs:
      go:
        description: 'Also tag the Go module (go/v<version>)'
        type: boolean
        default: true
  push:
    tags:
      - 'ts/v*'
      - 'web/v*'

permissions:
  contents: read

jobs:
  publish-npm:
    # The dispatch path has to be allowed through explicitly: a dispatch
    # runs on refs/heads/main, so the tag test alone would skip the job
    # and the run would succeed having published nothing.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/ts/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC -> npm; cannot write refs
      contents: write   # GITHUB_TOKEN -> tags; cannot publish
    outputs:
      clib-tag: ${{ steps.clib.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0   # tags, for the already-released guard

      # ADR-20: only a COMPONENT or a TOOL publishes. The repository's kind
      # is committed in .tabnas-kind (COMPONENT, TOOL, CONTENT or ADMIN), so
      # this workflow refuses to run in a repository that does not publish.
      - name: Refuse unless this repository publishes (COMPONENT or TOOL)
        run: |
          K="$(tr -d '[:space:]' < .tabnas-kind 2>/dev/null || true)"
          case "$K" in
            COMPONENT|TOOL) echo "kind: $K" ;;
            *) echo "::error::.tabnas-kind is '${K:-missing}', and only a COMPONENT or a TOOL publishes (admin ADR-20)"; exit 1 ;;
          esac

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Read the version
        id: v
        run: |
          V="$(node -p "require('./ts/package.json').version")"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Releasing $V"

      - name: Refuse a dispatch from anywhere but main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::release must be dispatched from main (got ${{ github.ref }})"
          exit 1

      - name: Decide which tags this run must create
        id: tags
        if: github.event_name == 'workflow_dispatch'
        run: |
          V="${{ steps.v.outputs.version }}"
          MISSING=""; ANCHOR=""
          for T in "ts/v$V" "go/v$V"; do
            case "$T" in
              go/*) [ "${{ inputs.go }}" = "true" ] || continue ;;
            esac
            if C="$(git rev-parse -q --verify "refs/tags/$T^{commit}")"; then
              [ -n "$ANCHOR" ] || ANCHOR="$C"
            else
              MISSING="$MISSING $T"
            fi
          done
          MISSING="$(echo $MISSING)"
          if [ -z "$MISSING" ]; then
            echo "::error::every tag this run would create already exists — bump the version first"
            exit 1
          fi

          # A REPAIR must name the commit the release actually happened at,
          # not whatever main has become since. If ts/v landed and go/v did
          # not, and main moved on, tagging HEAD would leave the two tags
          # identifying DIFFERENT commits — permanent for the Go module,
          # because proxy.golang.org caches module versions immutably.
          HEAD_C="$(git rev-parse HEAD)"
          if [ -z "$ANCHOR" ]; then
            ANCHOR="$HEAD_C"
          elif [ "$ANCHOR" != "$HEAD_C" ]; then
            if ! npm view "@tabnas/chess@$V" version >/dev/null 2>&1; then
              echo "::error::$V is tagged at $ANCHOR but is not on npm — publishing would ship HEAD while the tags name an older commit; resolve by hand"
              exit 1
            fi
            echo "repairing an earlier release: anchoring to $ANCHOR (HEAD has moved on)"
          fi
          echo "missing=$MISSING" >> "$GITHUB_OUTPUT"
          echo "anchor=$ANCHOR" >> "$GITHUB_OUTPUT"
          echo "will create:$MISSING at $ANCHOR"

      - name: Publish to npm if the version is missing (OIDC)
        working-directory: ts
        run: |
          V="${{ steps.v.outputs.version }}"
          npm install -g npm@latest
          if npm view "@tabnas/chess@$V" version >/dev/null 2>&1; then
            echo "@tabnas/chess@$V is already on npm — skipping publish"
          else
            npm i
            npm run build --if-present
            npm publish --access public
          fi

      - name: Tag the release
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for T in ${{ steps.tags.outputs.missing }}; do
            git tag "$T" "${{ steps.tags.outputs.anchor }}"
          done
          git push --atomic origin ${{ steps.tags.outputs.missing }}

      # ADR-19: hand the Go tag to the clib job. Read it from the REMOTE,
      # not from the step above: a push-path run tagged nothing itself, and
      # a dispatch with go: false has no Go tag for the C build to check out.
      - name: Hand the Go tag to the C release
        id: clib
        run: |
          T="go/v${{ steps.v.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$T" >/dev/null; then
            echo "tag=$T" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$T is not on the remote — no GitHub Release or C artifacts this run"
          fi

  # The GitHub Release and the C artifacts (ADR-19; see the header).
  clib:
    needs: publish-npm
    if: ${{ needs.publish-npm.outputs.clib-tag != '' }}
    permissions:
      contents: write   # GITHUB_TOKEN -> the Release and its assets
    uses: ./.github/workflows/clib-release.yml
    with:
      tag: ${{ needs.publish-npm.outputs.clib-tag }}

  # crates.io (ADR-21, deployed and inert; see the header). Two switches:
  # this `if` and the called job's own, both on the TABNAS_CRATES variable.
  crates:
    needs: publish-npm
    if: ${{ vars.TABNAS_CRATES == 'on' && needs.publish-npm.outputs.clib-tag != '' }}
    permissions:
      contents: read    # the tagged source
      id-token: write   # OIDC -> crates.io (a called job gets no more than this)
    uses: ./.github/workflows/crates-release.yml
    with:
      tag: ${{ needs.publish-npm.outputs.clib-tag }}

  # @tabnas/chess-game, the bundled <chess-game> web component in web/.
  # It carries its own version line and its own tag (`web/v*`) rather than
  # riding the library's: it is a built artifact whose contents change when
  # the BUNDLE changes — a new parser, a board fix — which is not the same
  # event as a grammar release. admin/publish.sh therefore covers ts/ and
  # go/ only, and this job is how the component ships.
  #
  # Tag-push only, deliberately — see the header.
  publish-web:
    if: startsWith(github.ref, 'refs/tags/web/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # ADR-20: only a COMPONENT or a TOOL publishes. The repository's kind
      # is committed in .tabnas-kind (COMPONENT, TOOL, CONTENT or ADMIN), so
      # this workflow refuses to run in a repository that does not publish.
      - name: Refuse unless this repository publishes (COMPONENT or TOOL)
        run: |
          K="$(tr -d '[:space:]' < .tabnas-kind 2>/dev/null || true)"
          case "$K" in
            COMPONENT|TOOL) echo "kind: $K" ;;
            *) echo "::error::.tabnas-kind is '${K:-missing}', and only a COMPONENT or a TOOL publishes (admin ADR-20)"; exit 1 ;;
          esac
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Build the library the component bundles
        working-directory: ts
        run: npm i && npm run build
      - name: Build and publish the component (OIDC trusted publishing)
        working-directory: web
        run: |
          npm install -g npm@latest
          npm i
          npm run build
          npm publish --access public
