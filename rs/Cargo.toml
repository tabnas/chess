[package]
name = "tabnas-chess"
version = "0.1.13"
edition = "2021"
rust-version = "1.85"
authors = ["Richard Rodger <http://richardrodger.com>"]
description = "A Tabnas grammar plugin that parses chess notation: PGN games and the SAN moves inside them."
license = "MIT"
repository = "https://github.com/tabnas/chess"
readme = "README.md"
keywords = ["chess", "pgn", "san", "notation", "parser"]
categories = ["parsing"]

[dependencies]
# The engine is on crates.io as tabnas-parser, but this committed manifest
# stays path-only: a sibling checkout of github.com/tabnas/parser, one
# directory up. The TypeScript and Go sides install the engine from npm and
# the Go module proxy instead, and need no checkout. crates-release.yml
# rewrites this path into a crates.io requirement when it publishes this
# crate. See README.md.
tabnas = { package = "tabnas-parser", path = "../../parser/rs" }
indexmap = { version = "2.2", features = ["serde"] }
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
